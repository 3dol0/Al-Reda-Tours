# ══════════════════════════════════════════
#  نشر الموقع على GitHub Pages
#  الموقع static بالكامل — مفيش build step،
#  فالـ workflow بيعمل mirror لـ main على فرع gh-pages
#  اللي بيخدم منه GitHub Pages.
# ══════════════════════════════════════════
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
