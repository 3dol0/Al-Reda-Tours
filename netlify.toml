# ══════════════════════════════════════════
#  الرضا للرحلات — Netlify config
#  موقع static بالكامل — مفيش build step
# ══════════════════════════════════════════

[build]
  publish = "."
  command = ""

# ── الصور: كاش طويل (الأسماء ثابتة) ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ── CSS/JS: يتراجع من السيرفر كل مرة عشان التحديثات تظهر فوراً ──
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── هيدرز أمان أساسية ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
